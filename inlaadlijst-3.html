<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inlaadlijst</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inlaadlijst">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="inlaad-icon.png">
<link rel="icon" type="image/png" href="inlaad-icon.png">
<style>
:root{--bg:#0b0b0f;--bg2:#1b0a10;--card:#17171d;--ink:#f5f3f1;--mute:#9a98a3;--line:#2a2a33;--red:#ff3347;--glow:rgba(255,51,71,.35);--on:#fff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf8f6;--bg2:#fde8ea;--card:#fff;--ink:#17171d;--mute:#6d6b76;--line:#e4e0dc;--red:#d4202e;--glow:rgba(212,32,46,.25);color-scheme:light}}
:root[data-theme="light"]{--bg:#faf8f6;--bg2:#fde8ea;--card:#fff;--ink:#17171d;--mute:#6d6b76;--line:#e4e0dc;--red:#d4202e;--glow:rgba(212,32,46,.25);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 50% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.brandrow{max-width:640px;margin:0 auto;padding:16px 16px 0}
.brandrow{text-align:center;padding-top:22px}
.lg{height:96px;width:auto;max-width:80%;display:block;margin:0 auto}
.lg-l{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .lg-d{display:none}:root:not([data-theme="dark"]) .lg-l{display:block}}
:root[data-theme="light"] .lg-d{display:none}
:root[data-theme="light"] .lg-l{display:block}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
#vl.on{display:block;flex:1 0 auto;padding-bottom:40px}
#vl main{max-width:640px;margin:0 auto;padding:12px 16px}
#vl .lhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
#vl .lhead h2{flex:1;margin:0;font-size:28px;letter-spacing:-.5px;text-transform:none;color:var(--ink)}
#vl .icon{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
#vl .btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;background:var(--red);color:var(--on);cursor:pointer}
#vl .btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
#vl .btn.on{background:var(--red);color:var(--on);border-color:var(--red)}
#vl .btn.big{width:100%;padding:18px;font-size:18px;box-shadow:0 6px 24px var(--glow);margin-bottom:16px}
#vl .lcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
#vl .lcard:active{transform:scale(.99)}
#vl .lcard h3,#vl #ld h3{margin:0;font-size:19px}
#vl .lsub{color:var(--mute);font-size:14px;margin:2px 0 10px}
#vl .lprog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
#vl .lprog i{display:block;height:100%;background:#2fbf71;transition:width .25s}
#vl .lst{font-size:14px;font-weight:600;margin-top:8px}
#vl .bad{color:var(--red)}
#vl .good{color:#2fbf71}
#vl .lempty{text-align:center;color:var(--mute);padding:40px 20px}
#vl .lempty b{display:block;font-size:40px;margin-bottom:8px}
#vl #ld{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(10px + env(safe-area-inset-bottom,0px))}
#vl #ld.open{display:flex}
#vl .lbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#vl .lbar .sp{flex:1}
#vl #ldt input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
#vl #ldt input:focus{outline:none;border-color:var(--red)}
#vl .seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px;margin:6px 0 10px}
#vl .seg button{flex:1;appearance:none;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:11px;border-radius:10px;cursor:pointer}
#vl .seg button.on{background:var(--red);color:var(--on)}
#vl .lmsg{font-weight:700;margin:8px 0 10px;min-height:22px}
#vl .lbody{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
#vl .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--card);cursor:pointer;user-select:none}
#vl .row.ok{border-color:#2fbf71}
#vl .row.miss{border-color:var(--red);background:rgba(255,51,71,.09)}
#vl .row.miss .nm{color:var(--red)}
#vl .row.dim{opacity:.4}
#vl .chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
#vl .row.ok .chk{background:#2fbf71;border-color:#2fbf71}
#vl .row.miss .chk{border-color:var(--red)}
#vl .nm{flex:1;font-weight:600;font-size:17px}
#vl .q{color:var(--mute);font-weight:700}
#vl .lfoot{display:flex;gap:8px;padding-top:8px}
#vl .lfoot .btn{flex:1;padding:13px 8px;font-size:15px}
#vl .grp{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}
#vl .chips{display:flex;flex-wrap:wrap;gap:8px}
#vl .pc{appearance:none;font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
#vl .pc:active{border-color:var(--red)}
#vl .addrow{display:flex;gap:8px;margin-top:14px}
#vl .addrow input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
#vl .addrow input:focus{outline:none;border-color:var(--red)}
#vl .dang{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
#vl .row .nm{display:flex;flex-direction:column;min-width:0}
#vl .row .mist{font-size:12px;font-weight:700;color:var(--red)}
#vl .row .mist:empty{display:none}
#vl .row.edit{cursor:default;padding:10px 10px 10px 14px;gap:10px}
#vl .stp{display:flex;align-items:center;gap:2px;flex:none;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:3px}
#vl .stp button{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;padding:0}
#vl .stp button:active{background:var(--red);color:var(--on)}
#vl .stp b{min-width:38px;text-align:center;font-size:16px}
#vl .del{flex:none;width:42px;height:42px;margin-left:8px;border-radius:12px;border:1.5px solid rgba(255,51,71,.45);background:rgba(255,51,71,.1);color:var(--red);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#vl .del:active{background:var(--red);color:var(--on)}
</style>
</head>

var PRE=[["Licht",["IP65 RGBW par","Showtec Xpression W","Rookmachine","Strobe bar","Kanjo spot 60","Avolites","Laser"]],
 ["Geluid",["Nexo PS15","Sub","Turbosound","Microfoon","Statief","DJ-set","Amprack","Soundcraft taperack","RCF speakers","Monitor"]],
 ["Kabels & stroom",["Verlengkabel","Stekkerdoos","Powercon-kabel","XLR-kabel","Stroomverdeler","Haspel","Speakons","Powercon doorlus","Euro kabel"]],
 ["Overig",["Truss 3m","Truss 2m","Gereedschap","Ladder"]]];
function load(){try{jobs=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){jobs=[]}
 jobs.forEach(function(j){(j.items||[]).forEach(function(it){if(typeof it.b!=="number")it.b=it.back?it.q:0;if(it.b>it.q)it.b=it.q})})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch(e){}}
function job(){for(var i=0;i<jobs.length;i++)if(jobs[i].id===cur)return jobs[i]}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fd(d){if(!d)return"Geen datum";var p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})}
function stats(j){var o=j.items.filter(function(x){return x.out}),mp=0;o.forEach(function(x){mp+=Math.max(0,x.q-x.b)});return{n:j.items.length,o:o.length,miss:mp}}
function stuks(n){return n+(n===1?" stuk":" stuks")}
function status(j,el){var s=stats(j);el.className="lst";
 if(!s.n){el.textContent="Nog geen materiaal";return}
 if(s.o<s.n){el.textContent="Nog "+(s.n-s.o)+" in te laden";el.classList.add("bad")}
 else if(s.miss>0){el.textContent="Alles mee · nog "+stuks(s.miss)+" niet terug";el.classList.add("bad")}
 else{el.textContent="✅ Alles weer terug";el.classList.add("good")}}
function renderList(){var box=$("llist");box.innerHTML="";
 if(!jobs.length){var e=document.createElement("div");e.className="lempty";e.innerHTML="<b>📦</b><span>Nog geen klussen. Maak eerst een nieuwe klus aan via stap 1 op de homepagina.</span>";box.appendChild(e);return}
 jobs.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||b.u-a.u}).forEach(function(j){
  var s=stats(j),c=document.createElement("div");c.className="lcard";
  c.innerHTML="<h3></h3><div class='lsub'></div><div class='lprog'><i></i></div><div></div>";
  c.children[0].textContent=j.name||"Zonder naam";c.children[1].textContent=fd(j.date)+" · "+s.n+(s.n===1?" item":" items");
  c.querySelector("i").style.width=(s.n?s.o/s.n*100:0)+"%";status(j,c.children[3]);
  c.onclick=function(){openJob(j.id,false,listMode)};box.appendChild(c)})}
function openJob(id,ed,m){fromNew=false;cur=id;edit=!!ed;only=false;var j=job();if(m==="back"&&j&&!j.ret){j.ret=true;save()}mode=m||"out";$("ld").classList.add("open");renderDetail()}
function addItem(n,q){var j=job(),k=n.trim().toLowerCase();if(!k)return;
 var f=j.items.filter(function(x){return x.n.toLowerCase()===k})[0];
 if(f)f.q+=q;else j.items.push({id:"i"+Date.now()+Math.floor(Math.random()*999),n:n.trim(),q:q,out:false,b:0});
 j.u=Date.now();save();renderDetail()}
function text(j){var out=mode==="out",miss=[],done=[];
 j.items.forEach(function(it){
  if(out){(it.out?done:miss).push(it.q+"× "+it.n)}
  else if(it.out){if(it.b>=it.q)done.push(it.q+"× "+it.n);else miss.push((it.q-it.b)+"× "+it.n+(it.b?" ("+it.b+" van "+it.q+" terug)":""))}});
 var L=["*Inlaadlijst: "+(j.name||"Zonder naam")+"*",fd(j.date),""];
 L.push(out?"Nog in te laden:":"Nog niet terug:");if(miss.length)miss.forEach(function(x){L.push("- "+x)});else L.push("- niets, alles compleet ✅");
 if(done.length){L.push("");L.push(out?"Al ingeladen:":"Al terug:");done.forEach(function(x){L.push("- "+x)})}
 return L.join("\n")}
function copy(t){function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Gekopieerd")}catch(e){toast("Kopiëren mislukt")}document.body.removeChild(a)}
 try{navigator.clipboard.writeText(t).then(function(){toast("Gekopieerd")},fb)}catch(e){fb()}}
function touch(j){j.u=Date.now();save();renderDetail()}
function stepper(label,onMinus,onPlus){var s=document.createElement("span");s.className="stp";
 s.innerHTML="<button type='button' aria-label='Minder'>−</button><b></b><button type='button' aria-label='Meer'>+</button>";
 s.children[1].textContent=label;
 s.children[0].onclick=function(e){e.stopPropagation();onMinus()};s.children[2].onclick=function(e){e.stopPropagation();onPlus()};
 s.onclick=function(e){e.stopPropagation()};return s}
function renderDetail(){var j=job();if(!j)return;var t=$("ldt"),body=$("lbody"),sc=body.scrollTop;t.innerHTML="";
 if(edit){var i1=document.createElement("input");i1.placeholder="Naam klus (bijv. Bruiloft Jansen)";i1.value=j.name;i1.oninput=function(){j.name=i1.value;j.u=Date.now();save()};
  var i2=document.createElement("input");i2.type="date";i2.value=j.date||"";i2.oninput=function(){j.date=i2.value;j.u=Date.now();save()};t.appendChild(i1);t.appendChild(i2)}
 else{var h=document.createElement("h3");h.textContent=j.name||"Zonder naam";var s=document.createElement("div");s.className="lsub";s.textContent=fd(j.date);t.appendChild(h);t.appendChild(s)}
 $("ldedit").textContent=edit?"Klaar":"Bewerken";
 $("lseg").style.display="none";$("lpw").style.display=edit?"none":"";$("lmsg").style.display=edit?"none":"";
 $("sgo").classList.toggle("on",mode==="out");$("sgb").classList.toggle("on",mode==="back");
 var L=j.items,tot=0,dn=0;
 L.forEach(function(it){if(mode==="out"){tot++;if(it.out)dn++}else if(it.out){tot+=it.q;dn+=it.b}});
 var mis=tot-dn;
 $("lpb").style.width=(tot?dn/tot*100:0)+"%";
 var m=$("lmsg");
 if(!L.length){m.textContent="";m.className="lmsg"}
 else if(mode==="back"&&!tot){m.textContent="Nog niets ingeladen";m.className="lmsg"}
 else if(mis>0){m.textContent=mode==="out"?"Nog in te laden: "+mis+" van "+tot:"Nog niet terug: "+stuks(mis)+" van "+tot;m.className="lmsg bad"}
 else{m.textContent=mode==="out"?"✅ Alles ingeladen":"✅ Alles weer terug";m.className="lmsg good"}
 body.innerHTML="";
 if(!L.length){var e=document.createElement("div");e.className="lempty";e.innerHTML="<b>📦</b><span></span>";e.children[1].textContent="Nog geen materiaal. Tik op Bewerken en voeg items toe.";body.appendChild(e)}
 L.forEach(function(it){var ok,miss,dim=false,partial=false;
  if(mode==="out"){ok=it.out;miss=!it.out}else if(!it.out){dim=true;ok=false;miss=false}else{ok=it.b>=it.q;miss=!ok;partial=miss&&it.b>0}
  if(!edit&&only&&!miss)return;
  var r=document.createElement("div");r.className="row"+(edit?" edit":ok?" ok":miss?" miss":"")+(!edit&&dim?" dim":"");
  if(edit){
   r.style.cursor="default";r.innerHTML="<span class='nm'><span class='t'></span></span>";r.querySelector(".t").textContent=it.n;
   r.appendChild(stepper(String(it.q),function(){it.q=Math.max(1,it.q-1);if(it.b>it.q)it.b=it.q;touch(j)},function(){it.q++;touch(j)}));
   var d=document.createElement("button");d.type="button";d.className="del";d.setAttribute("aria-label","Verwijder "+it.n);d.innerHTML=TRASH;
   d.onclick=function(){j.items=j.items.filter(function(x){return x!==it});touch(j)};r.appendChild(d)}
  else{
   r.innerHTML="<span class='chk'></span><span class='nm'><span class='t'></span><span class='mist'></span></span>";
   r.querySelector(".chk").textContent=ok?"✓":"";r.querySelector(".t").textContent=it.n;
   if(mode==="back"&&it.out&&miss){r.querySelector(".mist").textContent=partial?"Mist "+(it.q-it.b)+" · "+it.b+" van "+it.q+" terug":"Mist "+it.q}
   if(mode==="out"){r.appendChild(stepper(String(it.q),function(){it.q=Math.max(1,it.q-1);if(it.b>it.q)it.b=it.q;touch(j)},function(){it.q++;touch(j)}));
    r.onclick=function(){it.out=!it.out;if(!it.out)it.b=0;touch(j)}}
   else if(it.out){r.appendChild(stepper(it.b+"/"+it.q,function(){it.b=Math.max(0,it.b-1);touch(j)},function(){it.b=Math.min(it.q,it.b+1);touch(j)}));
    r.onclick=function(){it.b=it.b>=it.q?0:it.q;touch(j)}}
   else{var q=document.createElement("span");q.className="q";q.textContent="×"+it.q;r.appendChild(q)}}
  body.appendChild(r)});
 if(edit){
  PRE.forEach(function(g){var h=document.createElement("div");h.className="grp";h.textContent=g[0];body.appendChild(h);var c=document.createElement("div");c.className="chips";
   g[1].forEach(function(n){var b=document.createElement("button");b.type="button";b.className="pc";b.textContent="+ "+n;b.onclick=function(){addItem(n,1)};c.appendChild(b)});body.appendChild(c)});
  var ar=document.createElement("div");ar.className="addrow";ar.innerHTML="<input placeholder='Eigen item, bijv. 3x Truss' autocomplete='off'><button class='btn'>Voeg toe</button>";
  var inp=ar.children[0];function go(){var v=inp.value.trim();if(!v)return;var mm=v.match(/^(\d+)\s*[x×]\s*(.+)$/i);if(mm)addItem(mm[2],Math.max(1,parseInt(mm[1],10)));else addItem(v,1);inp.value=""}
  ar.children[1].onclick=go;inp.onkeydown=function(e){if(e.key==="Enter")go()};body.appendChild(ar);
  var d2=document.createElement("div");d2.className="dang";d2.innerHTML="<button class='btn alt'>Dupliceer klus</button><button class='btn alt'>Verwijder klus</button>";
  d2.children[0].onclick=function(){var n={id:"j"+Date.now(),name:(j.name||"Klus")+" (kopie)",date:today(),u:Date.now(),items:j.items.map(function(x){return{id:x.id,n:x.n,q:x.q,out:false,b:0}})};jobs.push(n);save();cur=n.id;edit=true;mode="out";toast("Gedupliceerd");renderDetail()};
  d2.children[1].onclick=function(){if(confirm("Deze klus en lijst verwijderen?")){jobs=jobs.filter(function(x){return x!==j});save();$("ld").classList.remove("open");cur=null;renderList()}};
  body.appendChild(d2)}
 var f=$("lfoot");f.innerHTML="";
 var allOut=mode==="out"&&L.length&&L.every(function(it){return it.out});
 var allBack=mode==="back"&&L.some(function(it){return it.out})&&L.every(function(it){return !it.out||it.b>=it.q});
 if(!edit&&L.length&&(allOut||allBack)){
  var k=document.createElement("button");k.className="btn";k.textContent="Klaar";k.style.flex="2";
  k.onclick=function(){$("ld").classList.remove("open");cur=null;showView("home");if(allBack)toast("Klus afgerond ✅")};
  var sh=document.createElement("button");sh.className="btn alt";sh.textContent="Deel";sh.onclick=function(){var tx=text(j);if(navigator.share){navigator.share({text:tx}).catch(function(){})}else copy(tx)};
  f.appendChild(k);f.appendChild(sh)}
 else if(!edit&&L.length){
  var a=document.createElement("button");a.className="btn alt";a.textContent="Alles aanvinken";a.onclick=function(){L.forEach(function(it){if(mode==="out"){it.out=true}else if(it.out){it.b=it.q}});touch(j)};
  var o=document.createElement("button");o.className="btn alt"+(only?" on":"");o.textContent="Alleen ontbrekend";o.onclick=function(){only=!only;renderDetail()};
  var s2=document.createElement("button");s2.className="btn";s2.textContent="Deel";s2.onclick=function(){var tx=text(j);if(navigator.share){navigator.share({text:tx}).catch(function(){})}else copy(tx)};
  f.appendChild(a);f.appendChild(o);f.appendChild(s2)}
 body.scrollTop=sc}
function dropIfEmpty(){var j=job();if(j&&!j.name.trim()&&!j.items.length){jobs=jobs.filter(function(x){return x!==j});save();return true}return false}
$("lnew").onclick=function(){var j={id:"j"+Date.now(),name:"",date:today(),u:Date.now(),items:[]};jobs.push(j);save();openJob(j.id,true);fromNew=true};
$("ldedit").onclick=function(){edit=!edit;if(!edit&&dropIfEmpty()){$("ld").classList.remove("open");cur=null;renderList();return}if(!edit&&fromNew){fromNew=false;$("ld").classList.remove("open");cur=null;showView("home");return}renderDetail()};
$("ldb").onclick=function(){dropIfEmpty();$("ld").classList.remove("open");cur=null;renderList()};
$("sgo").onclick=function(){mode="out";renderDetail()};$("sgb").onclick=function(){mode="back";renderDetail()};
function updateWarn(){var n=0;jobs.forEach(function(j){var s=stats(j);if(s.o&&s.miss>0&&(j.ret||(j.date&&j.date<today())))n++});
 $("lbadge").style.display=n?"block":"none";var w=$("lwarn");w.style.display=n?"block":"none";
 w.textContent=n?(n===1?"Let op: bij 1 klus is niet alles terug":"Let op: bij "+n+" klussen is niet alles terug"):""}
function showView(v,m){if(v==="home")updateWarn();if(m)listMode=m;$("jltitle").textContent=listMode==="out"?"Inladen":"Wat is terug";$("home").style.display=v==="home"?"":"none";$("jl").style.display=v==="list"?"":"none";if(v==="list")renderList()}
$("lout").onclick=function(){showView("list","out")};
$("lback").onclick=function(){showView("list","back")};
$("jlb").onclick=function(){showView("home")};
load();renderList();showView("home");
})();
</script>
</body>
</html>
